<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F5C4A"/>
      <stop offset="100%" stop-color="#163f33"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- sage arc, suggesting a checklist / progress ring -->
  <path d="M 256 80 A 176 176 0 1 1 116 168"
        fill="none" stroke="#A8C3B5" stroke-width="20" stroke-linecap="round" opacity="0.5"/>

  <!-- checkmark, doubling as the academy's "task complete" motif -->
  <path d="M 168 210 L 220 262 L 348 148"
        fill="none" stroke="#C8A96B" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- monogram -->
  <text x="256" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="700"
        fill="#F7F4EC" text-anchor="middle" letter-spacing="2">VA</text>
</svg>
