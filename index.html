<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VA Mastery Academy — Training Simulator</title>
<meta name="description" content="A hands-on, visual training simulator for real virtual-assistant client work.">
<meta name="theme-color" content="#1F5C4A">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VA Academy">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1F5C4A;
  --primary-d:#163f33;
  --primary-l:#2d7a63;
  --cream:#F7F4EC;
  --paper:#FFFFFF;
  --charcoal:#252A27;
  --sage:#A8C3B5;
  --sage-d:#7fa190;
  --gold:#C8A96B;
  --red:#B54339;
  --red-bg:#F7E7E5;
  --orange:#C1793A;
  --orange-bg:#F8ECDD;
  --blue:#3D6FA8;
  --blue-bg:#E6EEF6;
  --green-bg:#E5EFE9;
  --border: rgba(37,42,39,0.13);
  --shadow: 0 1px 2px rgba(37,42,39,0.06), 0 6px 20px rgba(37,42,39,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Work Sans', sans-serif;
  background:var(--cream);
  color:var(--charcoal);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Spectral', serif; margin:0 0 .4em 0; font-weight:600; color:var(--primary-d);}
h1{font-size:2rem; font-weight:700;}
h2{font-size:1.5rem;}
h3{font-size:1.15rem;}
p{margin:0 0 .8em 0;}
a{color:var(--primary);}
button{font-family:inherit; cursor:pointer;}
.app-shell{display:flex; min-height:100vh;}

/* SIDEBAR */
.sidebar{
  width:230px; flex-shrink:0; background:var(--primary-d); color:var(--cream);
  padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px 20px 8px; border-bottom:1px solid rgba(247,244,236,0.15); margin-bottom:14px;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--gold); display:flex;align-items:center;justify-content:center;font-family:'Spectral',serif;font-weight:700;color:var(--primary-d); font-size:1.1rem;}
.brand-name{font-family:'Spectral',serif; font-weight:600; font-size:1rem; line-height:1.2; color:var(--cream);}
.brand-sub{font-size:.7rem; opacity:.7; letter-spacing:.02em;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
  color:rgba(247,244,236,0.82); font-size:.92rem; font-weight:500; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
}
.nav-item:hover{background:rgba(247,244,236,0.08); color:var(--cream);}
.nav-item.active{background:var(--gold); color:var(--primary-d); font-weight:600;}
.nav-icon{width:18px; text-align:center; flex-shrink:0;}
.nav-section-label{font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; opacity:.5; margin:16px 8px 6px 8px;}

/* MAIN */
.main{flex:1; min-width:0; padding:32px 40px 80px 40px; max-width:1100px;}
.eyebrow{display:inline-block; font-size:.72rem; font-weight:600; letter-spacing:.04em; color:var(--primary); background:var(--green-bg); padding:3px 10px; border-radius:20px; margin-bottom:10px;}
.crumbs{font-size:.85rem; color:#6b7269; margin-bottom:6px;}
.crumbs button{background:none;border:none;color:var(--primary);font-weight:600;font-size:.85rem;padding:0;}

/* CARDS */
.card{background:var(--paper); border:1px solid var(--border); border-radius:12px; padding:20px 22px; box-shadow:var(--shadow);}
.card + .card{margin-top:16px;}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* TASK LIBRARY CARD */
.task-tile{cursor:pointer; transition:transform .12s, box-shadow .12s;}
.task-tile:hover{transform:translateY(-2px); box-shadow:0 4px 6px rgba(37,42,39,.08), 0 12px 28px rgba(37,42,39,.09);}
.tile-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.badge{display:inline-block; font-size:.7rem; font-weight:600; padding:2px 9px; border-radius:20px;}
.badge-beginner{background:var(--green-bg); color:var(--primary-d);}
.badge-intermediate{background:var(--orange-bg); color:var(--orange);}
.badge-advanced{background:var(--red-bg); color:var(--red);}
.meta-row{display:flex; gap:14px; font-size:.8rem; color:#6b7269; margin-top:10px; flex-wrap:wrap;}
.skill-chip{display:inline-block; background:var(--sage); color:var(--primary-d); font-size:.72rem; font-weight:600; padding:3px 9px; border-radius:6px; margin:2px 4px 0 0;}
.mastery-pill{font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:20px;}
.mastery-0{background:#eee; color:#888;}
.mastery-mid{background:var(--orange-bg); color:var(--orange);}
.mastery-done{background:var(--green-bg); color:var(--primary-d);}

/* CLIENT MESSAGE BUBBLE */
.client-msg-wrap{display:flex; gap:12px; align-items:flex-start; margin:10px 0;}
.avatar{width:40px;height:40px;border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Spectral',serif; flex-shrink:0;}
.client-bubble{background:var(--blue-bg); border-radius:4px 14px 14px 14px; padding:14px 16px; max-width:520px; font-size:.95rem;}
.client-name{font-weight:700; font-size:.85rem; color:var(--primary-d); margin-bottom:3px;}
.platform-tag{font-size:.68rem; color:#6b7269; margin-top:4px;}

/* TOOL CARD */
.tool-card{display:flex; gap:12px; align-items:flex-start; background:var(--cream); border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
.tool-emoji{font-size:1.4rem;}
.tool-why{font-size:.82rem; color:#565c56;}

/* WORKFLOW DIAGRAM */
.workflow{display:flex; flex-wrap:wrap; align-items:center; gap:0; margin:14px 0;}
.wf-node{background:var(--primary-d); color:#fff; font-size:.82rem; font-weight:600; padding:9px 14px; border-radius:8px; white-space:nowrap;}
.wf-arrow{color:var(--gold); font-size:1.2rem; margin:0 8px; font-weight:700;}
@media(max-width:700px){.workflow{flex-direction:column; align-items:flex-start;} .wf-arrow{transform:rotate(90deg); margin:2px 0 2px 16px;}}

/* STEP CARD */
.step-card{border-left:4px solid var(--primary); background:var(--cream); border-radius:0 10px 10px 0; padding:16px 18px; margin-bottom:14px;}
.step-num{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; background:var(--primary); color:#fff; font-weight:700; font-size:.85rem; margin-right:8px;}
.why-box{background:var(--orange-bg); border-radius:8px; padding:10px 14px; font-size:.87rem; margin-top:10px; border-left:3px solid var(--gold);}
.why-label{font-weight:700; color:var(--orange); font-size:.78rem; text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px;}

/* MOCK UI */
.mock-window{border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:var(--shadow); margin:12px 0; background:#fff;}
.mock-titlebar{background:#EDEAE1; padding:8px 12px; display:flex; align-items:center; gap:6px; font-size:.78rem; color:#6b7269; font-weight:600;}
.mock-dot{width:9px;height:9px;border-radius:50%;background:#d8d3c6;}
.mock-body{padding:0;}
.mock-row{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); font-size:.85rem; position:relative;}
.mock-row:last-child{border-bottom:none;}
.mock-highlight{outline:2px solid var(--gold); outline-offset:-2px; background:#FBF3E3;}
.start-here-tag{position:absolute; right:10px; top:50%; transform:translateY(-50%); background:var(--gold); color:var(--primary-d); font-size:.68rem; font-weight:700; padding:3px 9px; border-radius:6px;}
.mock-sender{font-weight:600; width:130px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mock-subject{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mock-date{font-size:.75rem; color:#999; flex-shrink:0;}

/* CATEGORY LABELS */
.cat-chip{display:inline-flex; align-items:center; gap:5px; font-size:.72rem; font-weight:700; padding:3px 9px; border-radius:6px; cursor:pointer; border:1.5px solid transparent;}
.cat-urgent{background:var(--red-bg); color:var(--red);}
.cat-action{background:var(--orange-bg); color:var(--orange);}
.cat-waiting{background:#FBF3D9; color:#93781f;}
.cat-info{background:var(--green-bg); color:var(--primary-d);}
.cat-reference{background:var(--blue-bg); color:var(--blue);}
.cat-newsletter{background:#eee; color:#777;}
.cat-chip.selected{border-color:currentColor;}

/* CHECKLIST */
.check-item{display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:.92rem;}
.check-item:last-child{border-bottom:none;}
.check-box{width:19px; height:19px; border-radius:5px; border:2px solid var(--sage-d); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:.75rem; color:#fff; font-weight:700;}
.check-box.checked{background:var(--primary); border-color:var(--primary);}
.check-item.checked span{text-decoration:line-through; color:#8a8f89;}

/* BEFORE AFTER */
.ba-wrap{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:stretch;}
@media(max-width:700px){.ba-wrap{grid-template-columns:1fr;}}
.ba-label{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:4px 10px; border-radius:20px; display:inline-block; margin-bottom:8px;}
.ba-before{background:var(--red-bg); color:var(--red);}
.ba-after{background:var(--green-bg); color:var(--primary-d);}

/* BUTTONS */
.btn{display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:8px; font-weight:600; font-size:.9rem; border:none;}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:hover{background:var(--primary-d);}
.btn-gold{background:var(--gold); color:var(--primary-d);}
.btn-outline{background:transparent; border:1.5px solid var(--primary); color:var(--primary);}
.btn-ghost{background:none; color:var(--primary); font-weight:600; padding:8px 0;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

/* PROGRESS BAR */
.pbar-track{background:#EAE6DA; border-radius:20px; height:9px; overflow:hidden;}
.pbar-fill{background:var(--primary); height:100%; border-radius:20px; transition:width .3s;}
.pbar-row{display:flex; justify-content:space-between; font-size:.82rem; margin-bottom:4px; font-weight:600;}

/* TABS within task */
.subtabs{display:flex; gap:4px; border-bottom:2px solid var(--border); margin:18px 0 16px 0; flex-wrap:wrap;}
.subtab{padding:9px 14px; font-size:.87rem; font-weight:600; color:#8a8f89; border:none; background:none; border-bottom:2px solid transparent; margin-bottom:-2px;}
.subtab.active{color:var(--primary-d); border-bottom-color:var(--primary);}

/* Priority matrix grid */
.matrix-2x2{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:10px; min-height:280px;}
.mq{border-radius:10px; padding:12px; font-size:.82rem;}
.mq-title{font-weight:700; font-size:.8rem; margin-bottom:6px;}
.mq1{background:var(--red-bg);} .mq2{background:var(--orange-bg);} .mq3{background:var(--blue-bg);} .mq4{background:#eee;}
.task-pill{background:#fff; border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:.78rem; margin-bottom:5px; box-shadow:0 1px 2px rgba(0,0,0,.04);}

/* Hint boxes */
.hint-box{background:var(--blue-bg); border-radius:8px; padding:12px 14px; margin-top:10px; font-size:.88rem; border-left:3px solid var(--blue);}
.hint-label{font-weight:700; color:var(--blue); font-size:.78rem; margin-bottom:2px;}

/* Mistake box */
.mistake-box{background:var(--red-bg); border-radius:8px; padding:12px 14px; margin-bottom:8px; font-size:.87rem; border-left:3px solid var(--red);}

.divider{height:1px; background:var(--border); margin:20px 0;}
.small-muted{font-size:.8rem; color:#7a8079;}
.icon-circle{width:38px;height:38px;border-radius:9px;background:var(--sage); display:flex;align-items:center;justify-content:center; font-size:1.1rem; flex-shrink:0;}

/* Mobile nav toggle */
.mobile-topbar{display:none;}
@media(max-width:820px){
  .sidebar{position:fixed; left:-240px; top:0; z-index:50; transition:left .2s; box-shadow:4px 0 20px rgba(0,0,0,.25);}
  .sidebar.open{left:0;}
  .mobile-topbar{display:flex; align-items:center; justify-content:space-between; background:var(--primary-d); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:40;}
  .main{padding:20px 16px 70px 16px;}
  .app-shell{display:block;}
}
.overlay{display:none;}
.overlay.show{display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:45;}
</style>
</head>
<body>
<div class="mobile-topbar">
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="brand-mark">VA</div>
    <div style="font-family:'Spectral',serif;font-weight:600;">VA Mastery Academy</div>
  </div>
  <button onclick="toggleSidebar()" style="background:none;border:none;color:#fff;font-size:1.4rem;">☰</button>
</div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<div class="app-shell">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">VA</div>
      <div>
        <div class="brand-name">VA Mastery<br>Academy</div>
        <div class="brand-sub">Hands-on training simulator</div>
      </div>
    </div>
    <div id="navList"></div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
/* ============================= STATE / STORAGE ============================= */
const LS = {
  get(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } },
  set(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
};
let state = { view:'dashboard', taskId:null, subtab:'brief' };

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function go(view, taskId){
  state.view = view; state.taskId = taskId || null; state.subtab='brief';
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  window.scrollTo(0,0);
  render();
}

/* ============================= DATA: TOOLS ============================= */
const TOOL_MAP = [
  {group:'Communication', tools:[
    {name:'Gmail', tier:'first', why:'Nearly every client runs on Gmail or Google Workspace — this is your day-one tool.'},
    {name:'Slack', tier:'first', why:'The default for quick client and team check-ins.'},
    {name:'Zoom', tier:'first', why:'Used for calls and meetings you\\'ll often help schedule.'},
    {name:'Outlook', tier:'next', why:'Common with corporate clients running Microsoft 365.'},
    {name:'Microsoft Teams', tier:'next', why:'Outlook\\'s equivalent to Slack — good to recognize, not urgent to master.'},
  ]},
  {group:'Productivity', tools:[
    {name:'Google Workspace (Docs/Sheets/Drive)', tier:'first', why:'The backbone of most VA deliverables — docs, trackers, shared files.'},
    {name:'Microsoft 365 (Word/Excel)', tier:'next', why:'Same skills as Google Workspace, different interface — learn once you\\'re comfortable with Sheets.'},
  ]},
  {group:'Project Management', tools:[
    {name:'Trello', tier:'first', why:'Simplest board tool — the easiest place to learn project management logic.'},
    {name:'Asana', tier:'next', why:'More structured, common with mid-size teams.'},
    {name:'ClickUp', tier:'next', why:'All-in-one, powerful but denser — learn after Trello/Asana.'},
    {name:'Notion', tier:'master', why:'Highly flexible; worth mastering once you understand how clients like to organize information.'},
  ]},
  {group:'CRM', tools:[
    {name:'HubSpot', tier:'next', why:'Common with marketing-driven small businesses.'},
    {name:'Zoho CRM', tier:'next', why:'Popular with lean startups — similar logic to HubSpot.'},
    {name:'Salesforce', tier:'master', why:'Enterprise-grade and complex — learn the fundamentals of CRM logic first elsewhere.'},
  ]},
  {group:'Automation', tools:[
    {name:'Zapier', tier:'master', why:'A major differentiator once you\\'re comfortable — automates repetitive multi-app tasks.'},
    {name:'Make', tier:'master', why:'Zapier\\'s more visual, more powerful cousin — for after you\\'ve automated a few workflows in Zapier.'},
  ]},
  {group:'Design & Scheduling', tools:[
    {name:'Canva', tier:'next', why:'Frequently requested for social posts, one-pagers, and simple decks.'},
    {name:'Calendly', tier:'next', why:'Removes the back-and-forth of scheduling — a very common VA setup task.'},
  ]},
  {group:'AI Assistants', tools:[
    {name:'Claude / ChatGPT', tier:'first', why:'Your force-multiplier for drafting, summarizing, and research — learn to prompt these well early.'},
    {name:'Gemini / Copilot', tier:'next', why:'Same skillset as Claude/ChatGPT, just embedded inside Google/Microsoft tools.'},
  ]},
];
const TIER_LABEL = {first:'LEARN FIRST', next:'LEARN NEXT', master:'MASTER LATER'};
const TIER_COLOR = {first:'badge-beginner', next:'badge-intermediate', master:'badge-advanced'};

/* ============================= DATA: CORPORATE -> VA MAP ============================= */
const CORP_MAP = [
  {from:'Handling 60–90 SAP SD support tickets a month', to:'High-volume inbox & task triage — sorting many incoming items fast without dropping anything'},
  {from:'Working inside a formal ITSM system (ServiceNow / SAP Solution Manager)', to:'Comfort learning any structured tool: CRMs, project boards, ticketing systems'},
  {from:'Mentoring ~10 junior colleagues', to:'Writing clear SOPs and how-to documentation a client\\'s team can actually follow'},
  {from:'Order-to-Cash process ownership', to:'End-to-end operations thinking — seeing a request through from start to finish, not just one step'},
  {from:'Doing SD configuration on service-request tickets', to:'Following a defined process precisely, with an eye for what "done correctly" looks like'},
  {from:'Coordinating with global stakeholders across time zones (S/4HANA support)', to:'Async-first client communication — clear updates that don\\'t require a live meeting'},
  {from:'Root-causing recurring incidents', to:'Spotting the real "why" behind a client request instead of just doing the surface task'},
  {from:'Working under SLAs and deadlines', to:'Prioritization instinct — urgent vs. important, and communicating realistic timelines'},
  {from:'Producing configuration and process documentation', to:'Client reporting — turning raw activity into a clean, readable summary'},
  {from:'Being the go-to person for a live production system', to:'Reliability as a trust signal — the trait clients pay a premium for in a VA'},
  {from:'Working across ECC and S/4HANA versions', to:'Comfort being a fast learner on unfamiliar software — a core VA skill'},
  {from:'Managing multiple concurrent tickets with different priorities', to:'Multitasking across a CEO\\'s inbox, calendar, and task list in the same morning'},
];

/* ============================= DATA: CHEAT SHEETS ============================= */
const CHEAT_SHEETS = [
  {title:'Email Management', icon:'📧', points:[
    '🔴 Urgent — client-facing, time-critical, or from someone senior',
    '🟠 Action Required — needs a reply or task, no fixed deadline',
    '🟡 Waiting/Follow-up — you\\'re blocked on someone else\\'s reply',
    '🟢 Informational — no action needed, just context',
    '🔵 Reference — save for later (contracts, receipts, credentials)',
    '⚪ Newsletter — archive or unsubscribe',
    'Rule of thumb: touch each email once — decide, don\\'t re-read.'
  ]},
  {title:'Calendar Management', icon:'📅', points:[
    'Fixed commitments (client calls, board meetings) move last — everything else moves around them',
    'Always add 10–15 min buffers around back-to-back meetings',
    'Confirm time zone explicitly — never assume',
    'When rescheduling, offer 2–3 alternative slots, not just "when works?"',
    'Flag true conflicts to the client — don\\'t silently choose for them if both meetings matter'
  ]},
  {title:'Prioritization (Eisenhower)', icon:'🎯', points:[
    'Urgent + Important → Do Now',
    'Important, not Urgent → Schedule it (this is where good VAs create the most value)',
    'Urgent, not Important → Delegate if possible',
    'Neither → Archive/ignore',
    'If everything feels urgent, that\\'s a sign to clarify with the client, not to freeze'
  ]},
  {title:'SOP Writing', icon:'📝', points:[
    'Purpose — why this process exists',
    'Scope — where it starts and ends',
    'Owner — who is accountable',
    'Trigger — what kicks it off',
    'Numbered steps — one action per step, written for someone who has never done it',
    'Quality check — how you know it was done right',
    'Escalation — what to do when something goes wrong'
  ]},
  {title:'Client Communication', icon:'💬', points:[
    'Lead with the outcome, not the process ("Inbox is sorted — 2 things need you today")',
    'Never leave a request acknowledged-but-silent for more than a day',
    'When you\\'re unsure of scope, ask one specific clarifying question — don\\'t guess',
    'Bad news: state it plainly, then immediately offer the next step',
    'Close every update loop — even "nothing needed from you" is worth saying'
  ]},
  {title:'Daily VA Checklist', icon:'✅', points:[
    'Start: check messages → check calendar → review deadlines → plan priorities',
    'During: update tasks as you go, communicate blockers immediately',
    'End: review what\\'s done vs. pending → send a short client update → set tomorrow\\'s top 3'
  ]},
];

/* ============================= DATA: DECISION SCENARIOS ============================= */
const DECISIONS = [
  {
    id:'d1',
    prompt:'A client messages: "Can you quickly update this spreadsheet?" You open it — it has 500 rows, and the client says they need it back in 20 minutes.',
    options:[
      {id:'a', text:'Say yes immediately and start working as fast as possible.'},
      {id:'b', text:'Reply that you can\\'t do it and leave it there.'},
      {id:'c', text:'Ask exactly what needs to change and confirm the real deadline before starting.'},
      {id:'d', text:'Do a partial update and hope it\\'s good enough.'}

function setChecklist(taskId, arr){ LS.set('check_'+taskId, arr); }
function checklistPct(task){
  const saved = getChecklist(task.id);
  const total = task.checklist.length;
  const done = task.checklist.filter((_,i)=>saved[i]).length;
  return total? Math.round(done/total*100) : 0;
}
function getTryItState(taskId){ return LS.get('tryit_'+taskId, {hints:0, answer:false}); }
function setTryItState(taskId, v){ LS.set('tryit_'+taskId, v); }
function taskMastery(task){
  const pct = checklistPct(task);
  const tryIt = getTryItState(task.id);
  if(pct===100 && tryIt.answer===false && tryIt.hints<2) return 'done'; // completed guided + attempted independently
  if(pct===100) return 'done';
  if(pct>0) return 'mid';
  return 'none';
}
function overallSkillMatrix(){
  const skillMap = {};
  TASKS.forEach(t=>{
    t.skills.forEach(s=>{
      if(!skillMap[s]) skillMap[s] = {learn:0,practice:0,independent:0,total:0};
      skillMap[s].total++;
      const pct = checklistPct(t);
      const tryIt = getTryItState(t.id);
      skillMap[s].learn += 1;
      if(pct>0) skillMap[s].practice += 1;
      if(pct===100 && (tryIt.answer || tryIt.hints>0)) skillMap[s].independent += 1;
    });
  });
  return skillMap;
}
function clientReadyScore(){
  let totalPct = 0;
  TASKS.forEach(t=> totalPct += checklistPct(t));
  return Math.round(totalPct / TASKS.length);
}

  const tstate = getTryItState(task.id);
  return `
  <div class="card">
    <div class="eyebrow">TRY IT YOURSELF — no instructions this time</div>
    <h3>${t.client}</h3>
    <div class="client-msg-wrap">

    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;">
      ${tstate.hints<1?`<button class="btn btn-outline" onclick="revealHint('${task.id}')">💡 Show Hint 1</button>`:''}
      ${tstate.hints===1?`<button class="btn btn-outline" onclick="revealHint('${task.id}')">💡 Show Hint 2</button>`:''}
      ${!tstate.answer?`<button class="btn btn-gold" onclick="revealAnswer('${task.id}')">Show Me the Answer</button>`:''}
    </div>

}
function revealHint(taskId){
  const s = getTryItState(taskId); s.hints = Math.min(2, s.hints+1); setTryItState(taskId, s); render();
}
function revealAnswer(taskId){
  const s = getTryItState(taskId); s.answer = true; setTryItState(taskId, s); render();
}

function renderWrapup(task){
  return `
  <div class="card">
    <h3>Common Mistakes to Avoid</h3>
    ${task.mistakes.map(m=>`<div class="mistake-box">${m}</div>`).join('')}
  </div>
  ${task.clientUpdate?`<div class="card"><h3>Telling the Client</h3><div class="client-msg-wrap"><div class="avatar">Y</div><div><div class="client-bubble" style="background:var(--green-bg);">${task.clientUpdate}</div><div class="platform-tag">Your reply</div></div></div></div>`:''}
  <div class="card" style="background:var(--primary-d); color:#fff;">
    <div class="eyebrow" style="background:var(--gold); color:var(--primary-d);">REMEMBER THIS</div>
    <ul style="margin-top:8px;">
      ${task.missionNotes.map(n=>`<li style="margin-bottom:6px;">${n}</li>`).join('')}
    </ul>
  </div>
  <button class="btn btn-primary" onclick="go('tasks')">← Back to Task Library</button>
  `;
}

/* ============================= RENDER: TOOL MAP ============================= */
function renderTools(){
  return `
  <div class="eyebrow">Tool Map</div>
  <h1>Learn tools in the right order</h1>
  <p class="small-muted" style="max-width:620px;">Don't try to learn everything at once. Each group is ranked so you build competence in the tools clients actually use first.</p>
  ${TOOL_MAP.map(g=>`
    <div class="card">
      <h3>${g.group}</h3>
      <div class="grid grid-2">
      ${g.tools.map(t=>`<div class="tool-card">
        <div style="flex:1;">
          <div style="display:flex; justify-content:space-between; align-items:center;"><b>${t.name}</b><span class="badge ${TIER_COLOR[t.tier]}">${TIER_LABEL[t.tier]}</span></div>
          <div class="tool-why">${t.why}</div>
        </div>
      </div>`).join('')}
      </div>
    </div>
  `).join('')}
  `;
}

/* ============================= RENDER: CHEAT SHEETS ============================= */
function renderCheatSheets(){
  return `
  <div class="eyebrow">Cheat Sheets</div>
  <h1>Quick reference, when you need it fast</h1>
  <div class="grid grid-2">
  ${CHEAT_SHEETS.map(c=>`
    <div class="card">
      <h3>${c.icon} ${c.title}</h3>
      <ul style="padding-left:18px; font-size:.88rem;">
        ${c.points.map(p=>`<li style="margin-bottom:6px;">${p}</li>`).join('')}
      </ul>
    </div>
  `).join('')}
  </div>
  `;
}

/* ============================= RENDER: CORPORATE MAP ============================= */
function renderMapping(){
  return `
  <div class="eyebrow">Your Experience → VA</div>
  <h1>Your SAP SD background, translated</h1>
  <p class="small-muted" style="max-width:640px;">You're not starting from zero. Five years in SAP SD support and Order-to-Cash already built real VA-relevant skill — here's the direct translation.</p>
  ${CORP_MAP.map(m=>`
    <div class="card">
      <div class="workflow">
        <div class="wf-node" style="background:var(--sage-d); color:var(--primary-d);">${m.from}</div>
        <span class="wf-arrow">→</span>
        <div class="wf-node">${m.to}</div>
      </div>
    </div>
  `).join('')}
  `;
}

/* ============================= RENDER: DECISIONS ============================= */
function renderDecisions(){
  return `
  <div class="eyebrow">What Would You Do?</div>
  <h1>Fast judgment calls, real stakes</h1>
  <div class="grid grid-2">
  ${DECISIONS.map(d=>renderDecisionCard(d)).join('')}
  </div>
  `;
}
function renderDecisionCard(d){
  const picked = LS.get('decision_'+d.id, null);
  return `<div class="card">
    <p><b>Scenario:</b> ${d.prompt}</p>
    ${d.options.map(o=>{
      const isPicked = picked===o.id;
      const isCorrect = o.id===d.correct;
      let style = '';
      if(picked){
        if(isCorrect) style = 'border-color:var(--primary); background:var(--green-bg);';
        else if(isPicked) style = 'border-color:var(--red); background:var(--red-bg);';
      }
      return `<button class="btn btn-outline" style="display:block; width:100%; text-align:left; margin-bottom:8px; ${style}" onclick="pickDecision('${d.id}','${o.id}')">${o.text}</button>`;
    }).join('')}
    ${picked?`<div class="why-box"><div class="why-label">Why</div>${d.explanation}</div>`:''}
  </div>`;
}
function pickDecision(id, opt){ LS.set('decision_'+id, opt); render(); }

/* ============================= MASTER RENDER ============================= */
function render(){
  renderNav();
  const main = document.getElementById('main');
  if(state.view==='dashboard') main.innerHTML = renderDashboard();
  else if(state.view==='tasks') main.innerHTML = renderTasks();
  else if(state.view==='taskDetail') main.innerHTML = renderTaskDetail(TASKS.find(t=>t.id===state.taskId));
  else if(state.view==='tools') main.innerHTML = renderTools();
  else if(state.view==='cheatsheets') main.innerHTML = renderCheatSheets();
  else if(state.view==='mapping') main.innerHTML = renderMapping();
  else if(state.view==='decisions') main.innerHTML = renderDecisions();
}
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      // Offline caching just won't be available this session — the app still works fully online.
    });
  });
}
</script>
